<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Product</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    #app {
      width: min(880px, 94vw);
      margin: 2rem auto;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
    }
    .upload-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    input {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #4a90d9;
    }
    button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      margin-left: 0.5rem;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #357abd;
    }
    .nutrition-card {
      margin: 1.5rem auto 0;
      width: min(560px, 100%);
      background: #ffffff;
      border: 4px solid #222;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .nutrition-card h2 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      line-height: 1.1;
      border-bottom: 8px solid #222;
      padding-bottom: 0.4rem;
    }
    .nf-subtitle {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      border-bottom: 2px solid #222;
      padding-bottom: 0.5rem;
    }
    .nf-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid #d1d5db;
      padding: 0.35rem 0;
      font-size: 0.95rem;
    }
    .nf-label {
      font-weight: 600;
    }
    .nf-value {
      text-align: right;
      white-space: nowrap;
    }
    .nf-section-title {
      font-weight: 700;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 3px solid #222;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 0.35rem;
    }
    .nf-small-print {
      margin-top: 0.75rem;
      font-size: 0.82rem;
      line-height: 1.3;
      color: #374151;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
